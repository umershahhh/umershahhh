# Place this file at: .github/workflows/snake.yml
# in your umershahhh/umershahhh profile repo (create that repo if it doesn't exist yet —
# a repo named exactly after your username is what GitHub shows on your profile page).
#
# After adding this file: go to the Actions tab in that repo and run
# "Generate Snake" once manually (workflow_dispatch). It will then also
# run automatically every day.

name: Generate Snake

on:
  schedule:
    - cron: "0 2 * * *"   # once a day at 02:00 UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: umershahhh
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
